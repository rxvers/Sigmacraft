name: Build SigmaCraftCore

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build plugin
        run: gradle clean build --no-daemon
      - name: Show result
        run: ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: SigmaCraftCore-0.3.0
          path: build/libs/SigmaCraftCore-0.3.0.jar
      - name: Publish release with JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-build-${{ github.run_number }}
          name: SigmaCraftCore 0.3.0 (Build ${{ github.run_number }})
          files: build/libs/SigmaCraftCore-0.3.0.jar
