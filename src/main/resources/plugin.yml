name: SigmaCraftCore
version: 0.3.0
main: de.sigmacraft.core.SigmaCraftCore
api-version: '26.3'
author: SigmaCraft
description: SigmaCraft Season 3 core features
commands:
  spawn:
    description: Teleportiert dich zum Spawn, wenn du nah genug bist.
    usage: /spawn
  scstats:
    description: Gibt Statistikdaten für die Discord-Anbindung aus.
    usage: /scstats <Spielername>
    permission: sigmacraft.stats
  team:
    description: SigmaCraft-Teams erstellen und verwalten.
    usage: /team
  sctop:
    description: Verwaltet Top-10-Hologramme.
    usage: /sctop <create|remove>
    permission: sigmacraft.admin
  sigmacraft:
    description: SigmaCraft-Statistikprotokoll für Discord.
    usage: /sigmacraft <stat|leaderboard> ...
    permission: sigmacraft.stats
permissions:
  sigmacraft.admin:
    description: Umgeht den Spawn-Schutz und die Spawn-Reichweitenbegrenzung.
    default: op
  sigmacraft.stats:
    description: Darf SigmaCraft-Statistiken abfragen.
    default: op
