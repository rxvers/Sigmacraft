name: SigmaCraftCore
version: 0.3.0
main: de.sigmacraft.core.SigmaCraftCore
api-version: '26.3'
author: SigmaCraft
description: SigmaCraft Season 3 core features
commands:
  spawn:
    description: Teleportiert dich nach kurzer Wartezeit zum Spawn.
    usage: /spawn
  scstats:
    description: Gibt Statistikdaten für die Discord-Anbindung aus.
    usage: /scstats <Spielername>
    permission: sigmacraft.stats
  team:
    description: SigmaCraft-Teams erstellen und verwalten.
    usage: /team
  sctop:
    description: Verwaltet Top-10-Hologramme.
    usage: /sctop <create|remove>
    permission: sigmacraft.admin
  admin:
    description: Öffnet das Admin-Panel (IP, Enderchest, Ban, Mute, Strafen-Log).
    usage: /admin [Spieler]
    permission: sigmacraft.admin
  access:
    description: Vorab-Zugang vor der Eröffnung verwalten.
    usage: /access <on|off|status|add|remove|list>
    permission: sigmacraft.admin
  zugriffe:
    description: Anti-Klau-Log (Behälter, Türen) mit Inspektor.
    usage: /zugriffe <inspect|near|player>
    aliases: [zlog, log]
    permission: sigmacraft.admin
  pvp:
    description: PvP-Kennzeichnung (Opt-in) und Liste.
    usage: /pvp <on|bestätigen|off|status|list>
    aliases: [kampf]
  regeln:
    description: Zeigt die PvP- und Griefing-Regeln.
    usage: /regeln
    aliases: [rules]
  stat:
    description: Zeigt Statistiken von dir oder einem anderen Spieler.
    usage: /stat <kills|deaths|blocks|diamonds|playtime|all> [Spieler]
    aliases: [stats]
  leaderboard:
    description: Zeigt die Top 10 einer Statistik.
    usage: /leaderboard <kills|deaths|blocks|diamonds|playtime>
    aliases: [lb]
  sigmacraft:
    description: Statistik-Befehle (auch für den Discord-Bot).
    usage: /sigmacraft <stat|leaderboard> ...
permissions:
  sigmacraft.admin:
    description: Umgeht Spawn-Schutz, Teleport-Wartezeit und Reichweitenbegrenzung.
    default: op
  sigmacraft.stats:
    description: Darf /scstats für die Discord-Anbindung nutzen.
    default: op
